name: Pocket Base checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          AGENT_DESK_EVIDENCE_DIR: ${{ runner.temp }}/pocket-base-evidence
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: ${{ runner.temp }}/pocket-base-evidence
